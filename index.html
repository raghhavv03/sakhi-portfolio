<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- .ico first: browsers and Vercel's project tile request /favicon.ico by
         default. Without a real file the SPA rewrite serves HTML, and the
         dashboard shows "issue rendering your favicon". SVG stays for modern tabs. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FBF9F5" />

    <!-- Theme, before first paint. Stored choice wins, otherwise the OS
         preference; without this the page would paint light and then snap to
         dark once React mounted. Kept in sync with src/lib/theme.js. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('sakhi-theme')
          var dark =
            stored === 'dark' ||
            (stored !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) {
            document.documentElement.classList.add('dark')
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute('content', '#0F172A')
          }
        } catch (e) {
          /* storage blocked — light it is */
        }
      })()
    </script>

    <!-- Inter — the site's one family, in its two weights (400 / 600). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <title>Sakhi Rana — UI/UX &amp; Product Designer</title>
    <meta
      name="description"
      content="Portfolio of Sakhi Rana, a UI/UX and product designer. Research-led case studies covering the problem, the process, and the outcome."
    />

    <!-- Link previews. Absolute URLs are required by most scrapers, so update
         og:url and og:image if the site ever moves off this domain. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sakhi Rana" />
    <meta property="og:title" content="Sakhi Rana — UI/UX &amp; Product Designer" />
    <meta
      property="og:description"
      content="Research-led product design — case studies, process, outcomes."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
